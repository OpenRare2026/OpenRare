[workspace]
name = "phenotype-hpo-score"
version = "3.0.0"
description = "Gene and variant phenotype scoring using HPO semantic similarity"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.12,<3.13"
pandas = ">=3.0,<3.1"
pyyaml = ">=6.0,<7"
fastapi = ">=0.136,<0.137"
uvicorn = ">=0.48,<0.49"
python-multipart = ">=0.0.29,<0.0.30"

[tasks]
check-paths = "python scripts/check_external_data.py"
score = "python src/phenotype_hpo_score.py --config config/paths.toml"
serve = "python scripts/start_api.py"
test = "python -m unittest discover -s tests -v"
