# Copy this file to config/paths.toml only when deployment-specific overrides
# are required. Relative paths are resolved from the project root.

[paths]
runtime_root = "runtime"
default_input_csv = "examples/test.P002.csv"
default_hpo_file = "examples/hpo_test.txt"

hpo_ontology = "external_data/hpo/hp.obo"
