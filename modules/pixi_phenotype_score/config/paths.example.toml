gene_disease_associations = "external_data/hpo/genes_to_disease.txt"
hgnc_symbols = "external_data/hgnc/hgnc_complete_set.txt"
mondo_ontology = "external_data/mondo/mondo-rare.obo"
omim_database = "external_data/omim/omim_20250411.sqlite3"
orphanet_packets = "external_data/orphanet/Orphapackets"
orphanet_index = "external_data/indexes/orpha_gene_profiles.pkl"
