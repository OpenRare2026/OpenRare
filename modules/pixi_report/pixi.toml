# pixi_report — 自包含子模块（可嵌入其他项目的 modules/ 目录）
# 运行：cd modules/pixi_report && pixi install && pixi run api

[workspace]
name = "pix-report"
version = "0.1.0"
description = "Genome report FastAPI service (self-contained Pixi module)"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.11,<3.13"

[pypi-dependencies]
search-agent = { path = ".", editable = true, extras = ["export"] }
deepagents = ">=0.6.8"
fastapi = ">=0.115.0"
jinja2 = ">=3.1.0"
langchain-mcp-adapters = ">=0.2.2"
langchain-openai = ">=1.2.2"
paper-search-mcp = ">=0.1.3"
pydantic = ">=2.0.0"
python-dotenv = ">=1.2.2"
neo4j = ">=5.0.0"
sse-starlette = ">=2.0.0"
uvicorn = ">=0.30.0"
pypandoc-binary = ">=1.17"
httpx = ">=0.27"

[tasks]
api = "uvicorn api.main:app --host 0.0.0.0 --port 8800"
health = "python -c \"import httpx; r=httpx.get('http://127.0.0.1:8800/health', timeout=5); print(r.status_code, r.text)\""
test-api = "bash scripts/test_api.sh"
