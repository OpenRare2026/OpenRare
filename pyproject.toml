[project]
name = "search-agent"
version = "0.1.0"
description = "Gene research agent with Open Targets, local ClinPGx, and literature search"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.6.8",
    "jinja2>=3.1.0",
    "langchain-mcp-adapters>=0.2.2",
    "langchain-openai>=1.2.2",
    "paper-search-mcp>=0.1.3",
    "pydantic>=2.0.0",
    "python-dotenv>=1.2.2",
    "neo4j>=5.0.0",
]

[project.optional-dependencies]
export = [
    "pypandoc-binary>=1.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "report", "tools"]
