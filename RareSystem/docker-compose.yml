services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rare-disease-app
    ports:
      - "8181:8181"
    env_file:
      - ./backend/.env
    environment:
      - API_HOST=0.0.0.0
      # Uncomment to use PostgreSQL instead of SQLite
      # - DATABASE_URL=postgresql://postgres:password@db:5432/rare_disease_db
      # LLM Configuration (optional - configure your LLM provider)
      # - LLM_PROVIDER=openai
      # - LLM_API_KEY=your-api-key
      # - LLM_MODEL=gpt-4
      # - LLM_BASE_URL=https://api.openai.com/v1
      # NCBI PubMed API (optional - for literature search)
      # - NCBI_EMAIL=your-email@example.com
      # - NCBI_API_KEY=your-ncbi-api-key
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8181/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

